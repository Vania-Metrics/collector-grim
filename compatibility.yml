# What this collector targets, and where it runs.
#   plugin:    does the target plugin itself run on this platform (at the version below)
#   collector: does this collector jar run there — yes | untested | no
#     untested: expected to load (Bukkit API), never checked on that server
#     folia: no until plugin.yml declares folia-supported: true
minecraft: 1.21.11
core: v0.4.0
plugin:
  name: GrimAC
  compiled-against: 2.3.74
  latest-for-minecraft: 2.3.74
  source: https://modrinth.com/plugin/grimac
platforms:
  paper: { plugin: yes, collector: yes }
  spigot: { plugin: yes, collector: untested }
  bukkit: { plugin: yes, collector: untested }
  folia: { plugin: yes, collector: no }
  purpur: { plugin: yes, collector: yes }
  sponge: { plugin: no, collector: no }
  bungeecord: { plugin: no, collector: no }
  geyser: { plugin: no, collector: no }
  velocity: { plugin: no, collector: no }
  waterfall: { plugin: no, collector: no }
